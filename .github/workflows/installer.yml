name: installer
on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/installer.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
# 이 워크플로는 저장소를 읽기만 합니다(토큰이 탈취돼도 코드·릴리스를 바꿀 수 없음).
permissions:
  contents: read
jobs:
  compile:
    # 실제 앱 대신 빈 파일로 설치 마법사와 Win11 우클릭 메뉴 패키지가 만들어지는지 확인합니다.
    # 진짜 설치 파일은 release.yml이 만듭니다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dummy publish folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory dummy | Out-Null
          foreach ($f in 'ImageConverter.exe','imgconv.exe','ImageConverter.ShellExtension.dll') { Set-Content (Join-Path dummy $f) 'x' }
      - name: Context menu package (sparse MSIX)
        shell: pwsh
        run: |
          $pw = [Guid]::NewGuid().ToString()
          ./packaging/New-DevCertificate.ps1 -Password $pw -OutDir $env:RUNNER_TEMP
          ./packaging/build-msix.ps1 -ContextMenuOnly -Version 0.0.1.0 -PublishDir dummy -PfxPath (Join-Path $env:RUNNER_TEMP ImageConverter.pfx) -PfxPassword $pw
          Copy-Item packaging/out/ImageConverter.ContextMenu.msix, packaging/out/ImageConverter.cer dummy/
      - name: Register and remove the package like the installer does
        # 러너 OS가 외부 위치 패키지를 지원하지 않으면 실패할 수 있어 결과만 남깁니다.
        continue-on-error: true
        shell: powershell
        run: |
          Copy-Item packaging/installer/ContextMenu.ps1 dummy/
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action Trust; if ($LASTEXITCODE) { throw "Trust failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action IsTrusted; if ($LASTEXITCODE) { throw "IsTrusted failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action Register; if ($LASTEXITCODE) { throw "Register failed" }
          Get-AppxPackage -Name ImageConverter.QuickConverter.ContextMenu | Format-List Name, Version, InstallLocation, IsDevelopmentMode
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action Unregister; if ($LASTEXITCODE) { throw "Unregister failed" }
      - name: Setup wizard
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Version 0.0.1 -PublishDir dummy
      - name: Install, update, move and uninstall (silent)
        # 설치 → 같은 버전으로 다시 실행(업데이트) → [수정]의 설치 위치 변경 → 제거를 차례로 확인합니다.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path packaging/out/Flipix-Setup-0.0.1.exe).Path
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B0E5F52-3C1B-4D52-9E58-4F1C2A7D9A10}_is1'
          $copy = Join-Path $env:LOCALAPPDATA 'Flipix\Installer\Flipix-Setup.exe'
          function Run($exe, $argList) {
            $p = Start-Process $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode) { throw "$exe $argList -> exit $($p.ExitCode)" }
          }
          $first = Join-Path $env:RUNNER_TEMP 'FlipixA'
          Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=`"`" /DIR=`"$first`" /LOG=`"$env:RUNNER_TEMP\1-install.log`""
          if (-not (Test-Path "$first\ImageConverter.exe")) { throw "not installed" }
          $k = Get-ItemProperty $key
          if ($k.NoModify -ne 0 -or $k.ModifyPath -notlike "*Flipix-Setup.exe*/MODIFY") { throw "Modify button not enabled: $($k.ModifyPath) $($k.NoModify)" }
          if (-not (Test-Path $copy)) { throw "installer copy missing" }

          # 업데이트: 이미 설치돼 있으면 같은 위치에 그대로
          Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$env:RUNNER_TEMP\2-update.log`""
          if ((Get-ItemProperty $key).'Inno Setup: App Path' -ne $first) { throw "update changed the install folder" }

          # 수정 > 설치 위치 변경
          $second = Join-Path $env:RUNNER_TEMP 'FlipixB'
          Run $copy "/MODIFY /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$second`" /LOG=`"$env:RUNNER_TEMP\3-move.log`""
          if (-not (Test-Path "$second\ImageConverter.exe")) { throw "not moved" }
          if (Test-Path $first) { throw "old folder left behind: $(Get-ChildItem $first -Recurse | Out-String)" }
          if ((Get-ItemProperty $key).'Inno Setup: App Path' -ne $second) { throw "uninstall info still points to the old folder" }

          # 제거
          Run "$second\unins000.exe" "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          for ($i = 0; $i -lt 30 -and (Test-Path $key); $i++) { Start-Sleep -Seconds 1 } # 제거 도우미가 임시 폴더에서 이어서 돎
          if (Test-Path $key) { throw "uninstall info left" }
          if (Test-Path $copy) { throw "installer copy left" }
          Write-Host "install/update/move/uninstall OK"
      - name: Installer logs
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:RUNNER_TEMP -Filter '*-*.log' | ForEach-Object { "==== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
