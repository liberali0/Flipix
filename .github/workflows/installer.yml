name: installer
on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/installer.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
# 이 워크플로는 저장소를 읽기만 합니다(토큰이 탈취돼도 코드·릴리스를 바꿀 수 없음).
permissions:
  contents: read
jobs:
  compile:
    # 실제 앱 대신 빈 파일로 설치 마법사와 Win11 우클릭 메뉴 패키지가 만들어지는지 확인합니다.
    # 진짜 설치 파일은 release.yml이 만듭니다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dummy publish folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory dummy | Out-Null
          foreach ($f in 'Flipix.exe','imgconv.exe') { Set-Content (Join-Path dummy $f) 'x' }
          # 내용으로 구분해서, PC에 맞는 우클릭 메뉴 DLL이 들어갔는지 아래에서 확인합니다.
          Set-Content dummy/Flipix.ShellExtension.dll 'x64'
          Set-Content dummy/Flipix.ShellExtension.arm64.dll 'arm64'
      - name: Context menu package (sparse MSIX)
        shell: pwsh
        run: |
          $pw = [Guid]::NewGuid().ToString()
          ./packaging/New-DevCertificate.ps1 -Password $pw -OutDir $env:RUNNER_TEMP
          ./packaging/build-msix.ps1 -ContextMenuOnly -Version 0.0.1.0 -PublishDir dummy -PfxPath (Join-Path $env:RUNNER_TEMP Flipix.pfx) -PfxPassword $pw
          Copy-Item packaging/out/Flipix.ContextMenu.msix, packaging/out/Flipix.cer dummy/
      - name: Register and remove the package like the installer does
        # 러너 OS가 외부 위치 패키지를 지원하지 않으면 실패할 수 있어 결과만 남깁니다.
        continue-on-error: true
        shell: powershell
        run: |
          Copy-Item packaging/installer/ContextMenu.ps1 dummy/
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action Trust; if ($LASTEXITCODE) { throw "Trust failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action IsTrusted; if ($LASTEXITCODE) { throw "IsTrusted failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action Register; if ($LASTEXITCODE) { throw "Register failed" }
          Get-AppxPackage -Name ImageConverter.QuickConverter.ContextMenu | Format-List Name, Version, InstallLocation, IsDevelopmentMode
          powershell -NoProfile -ExecutionPolicy Bypass -File dummy/ContextMenu.ps1 -Action Unregister; if ($LASTEXITCODE) { throw "Unregister failed" }
      - name: Setup wizard
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Version 0.0.1 -PublishDir dummy
      - name: Install, update, move and uninstall (silent)
        # 설치 → 같은 버전으로 다시 실행(업데이트) → [수정]의 설치 위치 변경 → 제거를 차례로 확인합니다.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path packaging/out/Flipix-Setup-0.0.1.exe).Path
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B0E5F52-3C1B-4D52-9E58-4F1C2A7D9A10}_is1'
          $copy = Join-Path $env:LOCALAPPDATA 'Flipix\Installer\Flipix-Setup.exe'
          function Run($exe, $argList) {
            $p = Start-Process $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode) { throw "$exe $argList -> exit $($p.ExitCode)" }
          }
          $first = Join-Path $env:RUNNER_TEMP 'FlipixA'
          Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=`"`" /DIR=`"$first`" /LOG=`"$env:RUNNER_TEMP\1-install.log`""
          if (-not (Test-Path "$first\Flipix.exe")) { throw "not installed" }
          if ((Get-Content "$first\Flipix.ShellExtension.dll") -ne 'x64') { throw "wrong menu DLL on x64" }
          if (Test-Path "$first\Flipix.ShellExtension.arm64.dll") { throw "arm64 DLL copied on x64" }
          $k = Get-ItemProperty $key
          if ($k.NoModify -ne 0 -or $k.ModifyPath -notlike "*Flipix-Setup.exe*/MODIFY") { throw "Modify button not enabled: $($k.ModifyPath) $($k.NoModify)" }
          if (-not (Test-Path $copy)) { throw "installer copy missing" }

          # 업데이트: 이미 설치돼 있으면 같은 위치에 그대로
          Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$env:RUNNER_TEMP\2-update.log`""
          if ((Get-ItemProperty $key).'Inno Setup: App Path' -ne $first) { throw "update changed the install folder" }

          # 수정 > 설치 위치 변경
          $second = Join-Path $env:RUNNER_TEMP 'FlipixB'
          Run $copy "/MODIFY /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$second`" /LOG=`"$env:RUNNER_TEMP\3-move.log`""
          if (-not (Test-Path "$second\Flipix.exe")) { throw "not moved" }
          if (Test-Path $first) { throw "old folder left behind: $(Get-ChildItem $first -Recurse | Out-String)" }
          if ((Get-ItemProperty $key).'Inno Setup: App Path' -ne $second) { throw "uninstall info still points to the old folder" }

          # 제거
          Run "$second\unins000.exe" "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          for ($i = 0; $i -lt 30 -and (Test-Path $key); $i++) { Start-Sleep -Seconds 1 } # 제거 도우미가 임시 폴더에서 이어서 돎
          if (Test-Path $key) { throw "uninstall info left" }
          if (Test-Path $copy) { throw "installer copy left" }
          for ($i = 0; $i -lt 10 -and (Test-Path $second); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $second) { throw "install folder left after uninstall: $(Get-ChildItem $second -Recurse | Out-String)" }

          # 예전 기본 폴더 이름(QuickImageConverter)에서 업데이트하면 옆의 Flipix 폴더로 옮김
          $old = Join-Path $env:RUNNER_TEMP 'QuickImageConverter'
          $new = Join-Path $env:RUNNER_TEMP 'Flipix'
          Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=`"`" /DIR=`"$old`""
          Set-Content "$old\ImageConverter.exe" 'old'
          Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$env:RUNNER_TEMP\4-migrate.log`""
          if ((Get-ItemProperty $key).'Inno Setup: App Path' -ne $new) { throw "not migrated to the Flipix folder" }
          if (-not (Test-Path "$new\Flipix.exe")) { throw "not installed in the Flipix folder" }
          $runOnce = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce'
          if (-not (Get-ItemProperty $runOnce).FlipixRemoveOldFolder) { throw "old folder not scheduled for removal" }
          Remove-ItemProperty $runOnce FlipixRemoveOldFolder
          Remove-Item $old -Recurse -Force

          # 제거하면 설정 폴더까지 남김없이 지움
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Flipix" | Out-Null
          Set-Content "$env:LOCALAPPDATA\Flipix\settings.json" '{}'
          Set-Content "$new\Flipix.ShellExtension.dll.20260101000000.old" 'x'
          Run "$new\unins000.exe" "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          for ($i = 0; $i -lt 30 -and (Test-Path $key); $i++) { Start-Sleep -Seconds 1 }
          for ($i = 0; $i -lt 10 -and (Test-Path $new); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $new) { throw "install folder left after uninstall: $(Get-ChildItem $new -Recurse | Out-String)" }
          if (Test-Path "$env:LOCALAPPDATA\Flipix") { throw "settings folder left after uninstall" }
          Write-Host "install/update/move/migrate/uninstall OK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-dummy
          path: packaging/out/Flipix-Setup-0.0.1.exe
      - name: Installer logs
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:RUNNER_TEMP -Filter '*-*.log' | ForEach-Object { "==== $($_.Name)"; Get-Content $_.FullName -Tail 40 }

  arm64:
    # 같은 설치 파일이 ARM64 PC(Windows 11 ARM)에서 ARM64용 우클릭 메뉴 DLL을 넣는지 확인합니다.
    needs: compile
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup-dummy
      - name: Install and uninstall (silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'FlipixArm'
          $p = Start-Process (Resolve-Path Flipix-Setup-0.0.1.exe).Path -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=`"`" /DIR=`"$dir`" /LOG=`"$env:RUNNER_TEMP\arm-install.log`"" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\arm-install.log" -Tail 40; throw "install exit $($p.ExitCode)" }
          if ((Get-Content "$dir\Flipix.ShellExtension.dll") -ne 'arm64') { throw "wrong menu DLL on ARM64" }
          if (Test-Path "$dir\Flipix.ShellExtension.arm64.dll") { throw "arm64 DLL left under its build name" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall exit $($p.ExitCode)" }
          Write-Host "ARM64 install OK"
