name: cert-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Read signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { throw "SIGN_PFX_BASE64 is empty" }
          if (-not $env:SIGN_PFX_PASSWORD) { throw "SIGN_PFX_PASSWORD is empty" }
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $c = [Security.Cryptography.X509Certificates.X509Certificate2]::new([byte[]]$bytes, $env:SIGN_PFX_PASSWORD, $flags)
          "Subject: $($c.Subject)"; "Thumbprint: $($c.Thumbprint)"; "NotAfter: $($c.NotAfter)"; "HasPrivateKey: $($c.HasPrivateKey)"
          "CodeSigning: $(($c.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' }).Format($false))"
          if (-not $c.HasPrivateKey) { throw "no private key" }
